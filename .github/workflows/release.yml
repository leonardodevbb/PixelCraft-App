name: Release

# Publishing a version: push a tag like v0.2.0 on main, or run this workflow
# by hand on main (it then creates the tag v<package.json version>). It builds
# the Linux packages, smoke-tests them and creates the GitHub Release with the
# notes from docs/releases/<version>.md and a SHA256SUMS file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Version from package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = main || { echo "Run it on main"; exit 1; }
          fi
          test -f "docs/releases/$v.md" || { echo "Missing docs/releases/$v.md"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb desktop-file-utils appstream flatpak flatpak-builder
      - run: npm run build
      - run: npx electron-builder --linux deb AppImage
      - run: bash scripts/build-flatpak.sh
      - run: bash scripts/verify-packages.sh --smoke --flatpak-run
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.deb *.AppImage *.flatpak > SHA256SUMS
          # On a manual run the tag does not exist yet; gh creates it on this commit.
          gh release create "v$VERSION" *.deb *.AppImage *.flatpak SHA256SUMS \
            --title "PixelCraft $VERSION" --notes-file "../docs/releases/$VERSION.md" --target "$GITHUB_SHA"
